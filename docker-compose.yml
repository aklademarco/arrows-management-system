name: arrows-church-management-system

services:
  caddy:
    image: caddy:2.10-alpine
    container_name: arrows-caddy
    restart: unless-stopped
    profiles: ["production"]

    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

    networks:
      - arrows-network

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile

    image: ghcr.io/aklademarco/arrows-management-system-web:${IMAGE_TAG:-latest}
    container_name: arrows-web
    restart: unless-stopped
    profiles: ["production"]

    environment:
      NODE_ENV: production
      PORT: 3000
      API_URL: http://api:4000/api/v1
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

    ports:
      - "127.0.0.1:3000:3000"

    depends_on:
      api:
        condition: service_healthy

    networks:
      - arrows-network

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile

    image: ghcr.io/aklademarco/arrows-management-system-api:${IMAGE_TAG:-latest}
    container_name: arrows-api
    restart: unless-stopped
    profiles: ["production"]

    env_file:
      - .env

    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-arrows}:${POSTGRES_PASSWORD:-arrows_local_password}@postgres:5432/${POSTGRES_DB:-arrows_cms}

    ports:
      - "127.0.0.1:4000:4000"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/v1/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

    networks:
      - arrows-network

  postgres:
    image: postgres:17-alpine
    container_name: arrows-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arrows_cms}
      POSTGRES_USER: ${POSTGRES_USER:-arrows}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arrows_local_password}

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-arrows} -d ${POSTGRES_DB:-arrows_cms}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - arrows-network

volumes:
  postgres_data:
    name: arrows_cms_postgres_data
  caddy_data:
    name: arrows_caddy_data
  caddy_config:
    name: arrows_caddy_config

networks:
  arrows-network:
    name: arrows_management_network
    driver: bridge
