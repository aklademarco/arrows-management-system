name: Deploy production

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/aklademarco/arrows-management-system-api
  WEB_IMAGE: ghcr.io/aklademarco/arrows-management-system-web

jobs:
  publish:
    name: Build and publish images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GitHub Actions to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy to VPS
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # SSH SETUP
      # ----------------------------------------------------------

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNWON_HOST }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -e

          install -m 700 -d ~/.ssh

          if [ -z "$SSH_KEY" ]; then
            echo "ERROR: VPS_SSH_KEY is empty"
            exit 1
          fi

          if [ -z "$KNOWN_HOSTS" ]; then
            echo "ERROR: VPS_KNOWN_HOST is empty"
            exit 1
          fi

          if [ -z "$VPS_HOST" ]; then
            echo "ERROR: VPS_HOST is empty"
            exit 1
          fi

          printf '%s\n' "$SSH_KEY" \
            | tr -d '\r' \
            > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$KNOWN_HOSTS" \
            | tr -d '\r' \
            > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

          if ! ssh-keygen \
            -F "$VPS_HOST" \
            -f ~/.ssh/known_hosts \
            >/dev/null; then

            echo "ERROR: VPS host was not found in known_hosts"
            exit 1
          fi

          echo "VPS known_hosts entry found."

          echo "Configured VPS fingerprint:"
          ssh-keygen -lf ~/.ssh/known_hosts

      # ----------------------------------------------------------
      # TEST SSH
      # ----------------------------------------------------------

      - name: Test VPS SSH connection
        run: |
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "echo 'SSH connection successful'"

      # ----------------------------------------------------------
      # UPLOAD COMPOSE FILE
      # ----------------------------------------------------------

      - name: Upload deployment configuration
        run: |
          ssh \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "mkdir -p /opt/arrows"

          scp \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            docker-compose.yml \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/arrows/docker-compose.yml"

      # ----------------------------------------------------------
      # VPS -> GHCR LOGIN
      # ----------------------------------------------------------

      - name: Login VPS to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
        run: |
          if [ -z "$GHCR_TOKEN" ]; then
            echo "ERROR: GHCR_TOKEN is empty"
            exit 1
          fi

          if [ -z "$GHCR_USERNAME" ]; then
            echo "ERROR: GHCR_USERNAME is empty"
            exit 1
          fi

          printf '%s' "$GHCR_TOKEN" | \
            ssh \
              -o StrictHostKeyChecking=yes \
              -o IdentitiesOnly=yes \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
              "docker login ghcr.io \
                -u '$GHCR_USERNAME' \
                --password-stdin"

      # ----------------------------------------------------------
      # DEPLOY
      # ----------------------------------------------------------

      - name: Activate release
        run: |
          ssh \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd /opt/arrows && \
            IMAGE_TAG='${{ github.sha }}' \
            docker compose \
              --env-file .env \
              --profile production \
              pull && \
            IMAGE_TAG='${{ github.sha }}' \
            docker compose \
              --env-file .env \
              --profile production \
              up -d --remove-orphans"

      # ----------------------------------------------------------
      # SHOW CONTAINER STATUS
      # ----------------------------------------------------------

      - name: Show deployment status
        run: |
          ssh \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd /opt/arrows && \
            IMAGE_TAG='${{ github.sha }}' \
            docker compose \
              --env-file .env \
              --profile production \
              ps"

      # ----------------------------------------------------------
      # HEALTH CHECK
      # ----------------------------------------------------------

      - name: Verify production health
        run: |
          for attempt in $(seq 1 30); do

            echo "Health check attempt $attempt/30"

            if curl \
              --fail \
              --silent \
              --show-error \
              "${{ secrets.APP_URL }}/api/v1/health"; then

              echo ""
              echo "Production deployment is healthy."
              exit 0
            fi

            sleep 5
          done

          echo "Production health check failed."

          echo "Showing API logs..."

          ssh \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "docker logs arrows-api --tail 100 || true"

          exit 1