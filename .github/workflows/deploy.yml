name: Deploy production

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/aklademarco/arrows-management-system-api
  WEB_IMAGE: ghcr.io/aklademarco/arrows-management-system-web

jobs:
  publish:
    name: Build and publish images
    runs-on: ubuntu-latest

    steps:
      # Get project source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Enable Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login GitHub Actions runner to GHCR
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: true

          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest

          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: true

          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.WEB_IMAGE }}:latest

          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy to VPS
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}

        run: |
          install -m 700 -d ~/.ssh

          printf '%s' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload deployment configuration
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "mkdir -p /opt/arrows"

          scp docker-compose.yml \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/arrows/docker-compose.yml"

      - name: Login VPS to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}

        run: |
          printf '%s' "$GHCR_TOKEN" | \
            ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "docker login ghcr.io \
              -u '$GHCR_USERNAME' \
              --password-stdin"

      - name: Activate release
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd /opt/arrows && \
            IMAGE_TAG='${{ github.sha }}' \
            docker compose \
              --env-file .env \
              --profile production \
              pull && \
            IMAGE_TAG='${{ github.sha }}' \
            docker compose \
              --env-file .env \
              --profile production \
              up -d --remove-orphans"

      - name: Show deployment status
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd /opt/arrows && \
            docker compose \
              --env-file .env \
              --profile production \
              ps"

      - name: Verify production health
        run: |
          for attempt in $(seq 1 30); do

            echo "Health check attempt $attempt/30"

            if curl \
              --fail \
              --silent \
              --show-error \
              "${{ secrets.APP_URL }}/api/v1/health"; then

              echo ""
              echo "Production deployment is healthy."
              exit 0
            fi

            sleep 5
          done

          echo "Production health check failed."
          exit 1